github_checks:  # too noisy, even though "a" interactively disables them
  annotations: false

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no

codecov:
  notify:
    require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    patch:
      default:
        informational: true
        target: 90%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    project:
      default: false
      library:
        informational: true
        target: 90%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

ignore:
  - "docs"
  - "logos"
  - "phys2cvr/cmaps"
  - "phys2cvr/cli"
  - "phys2cvr/_version.py"
  - "**/__init__.py"
  - "**/**/__init__.py"
  - "phys2cvr/tests"
  - ".*rc"
  - ".github"
